name: Fetch F1 Data & Deploy

on:
  schedule:
    # Off the hour: GitHub delays top-of-hour crons the most under load.
    - cron: '17 20 * * 6'   # Saturday 20:17 UTC — qualifying / sprint results, OpenF1 practice & quali, Saturday races (Baku, Las Vegas)
    - cron: '17 23 * * 0'   # Sunday 23:17 UTC — catches most race results
    - cron: '17 6 * * 1'    # Monday 06:17 UTC — retry for late races (Miami/Austin/Mexico end ~22:00 UTC Sunday)
  push:
    branches: ['main']
  workflow_dispatch:         # Manual trigger
    inputs:
      allow_shrink:
        description: 'Accept data smaller than the last deploy (a round removed from the calendar)'
        type: boolean
        default: false
      refetch_meetings:
        description: 'OpenF1 meeting keys to refetch despite the cache, comma-separated, or "all"'
        type: string
        default: ''

permissions:
  contents: write            # the "commit fetched data back" step pushes to main
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Latest main, not the triggering SHA: a run that queued behind another
          # then starts from that run's data commit (its OpenF1 cache and baseline).
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

      # Each source fails soft. The fetch scripts only write their output at the
      # end, so a failed source leaves its committed files in place, the
      # validator still gates the build, the other sources still ship, and the
      # last step turns the run red so the failure gets noticed.
      - name: Fetch F1 data from Jolpica API
        id: jolpica
        continue-on-error: true
        run: node scripts/fetch-f1-data.mjs
      - name: Fetch sector & speed data from OpenF1 API
        id: openf1
        continue-on-error: true
        run: node scripts/fetch-openf1-data.mjs
        env:
          REFETCH_MEETINGS: ${{ inputs.refetch_meetings }}
      - uses: actions/setup-python@v7
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          python-version: '3.12'
      - name: Fetch driver quotes from YouTube
        id: quotes
        if: env.HAS_ANTHROPIC_KEY == 'true'
        continue-on-error: true
        run: |
          pip install youtube-transcript-api "anthropic>=1.3,<2" requests
          python scripts/fetch-driver-quotes.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Validate fetched data
        run: node scripts/validate-data.mjs
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - id: deployment
        uses: actions/deploy-pages@v5

      # Persist the fetched data in git. One step, three jobs:
      #  1. the OpenF1 incremental cache survives between runs — CI checks out
      #     fresh, so before this every run refetched every meeting since the
      #     last human commit (~1 min per meeting, heading for the 30-min cap)
      #  2. validate-data.mjs compares against what actually shipped last time
      #  3. the commit counts as repo activity, so GitHub never again disables
      #     the crons for 60-day inactivity (which froze the site in Aug 2026)
      # GITHUB_TOKEN pushes never trigger workflows, so this cannot loop.
      # scripts/commit-data.sh re-applies this run's outputs on top of the latest
      # main, so neither new video IDs nor a queued run can make it skip.
      - name: Commit fetched data back to main
        id: commit
        # Run a copy: the script resets the checkout it lives in
        run: |
          cp scripts/commit-data.sh "$RUNNER_TEMP/commit-data.sh"
          bash "$RUNNER_TEMP/commit-data.sh"

      - name: Run summary
        if: always()
        run: node scripts/run-summary.mjs
        env:
          JOLPICA_OUTCOME: ${{ steps.jolpica.outcome }}
          OPENF1_OUTCOME: ${{ steps.openf1.outcome }}
          QUOTES_OUTCOME: ${{ steps.quotes.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
      - name: Fail the run if a source failed
        if: steps.jolpica.outcome == 'failure' || steps.openf1.outcome == 'failure' || steps.quotes.outcome == 'failure'
        run: |
          echo "::error::A data source failed (Jolpica: ${{ steps.jolpica.outcome }}, OpenF1: ${{ steps.openf1.outcome }}, quotes: ${{ steps.quotes.outcome }}). The site deployed with the last good data for that source — check the step log."
          exit 1
