<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 2026 Dashboard</title>
    <meta name="description" content="Formula 1 2026 season dashboard — live standings, race results, sector times, telemetry replays, head-to-head battles, pit stops and schedule." />
    <meta name="theme-color" content="#1B1F24" />
    <!-- Social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="F1 2026 Season Dashboard" />
    <meta property="og:description" content="Standings, race results, sector times, telemetry replays and head-to-head battles for the 2026 Formula 1 season." />
    <meta property="og:url" content="https://rowanflynnpilot.github.io/f1-dashboard/" />
    <meta property="og:image" content="https://rowanflynnpilot.github.io/f1-dashboard/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The dashboard's first sheet: the last Grand Prix drawn as a lap chart beside the drivers' standings" />
    <link rel="canonical" href="https://rowanflynnpilot.github.io/f1-dashboard/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://rowanflynnpilot.github.io/f1-dashboard/og.png" />
    <meta name="twitter:title" content="F1 2026 Season Dashboard" />
    <meta name="twitter:description" content="Standings, race results, sector times, telemetry replays and head-to-head battles for the 2026 Formula 1 season." />
    <meta name="twitter:image:alt" content="The dashboard's first sheet: the last Grand Prix drawn as a lap chart beside the drivers' standings" />
    <!-- data.json gates first paint: start it now, in parallel with the bundle,
         instead of after the bundle has parsed (fetch() reuses this response) -->
    <link rel="preload" href="%BASE_URL%data.json" as="fetch" crossorigin />
    <!-- Fonts: preconnected early, stylesheet applied without blocking render
         (display=swap text appears in fallback faces, then swaps) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" /></noscript>
  </head>
  <body>
    <!-- Static shell: paints with the stylesheet, before any JavaScript runs.
         React replaces it with the same loading screen, then the sheets. -->
    <div id="root"><!--shell--><div class="bench" style="display:flex;align-items:center;justify-content:center"><div style="text-align:center;color:#E6ECF1"><div class="head" style="font-size:30px;font-weight:700;margin-bottom:6px">Opening the season sheets</div><div class="num" style="color:#93A1AF;font-size:13px">reading data.json …</div></div></div><!--/shell--></div>
    <noscript><p style="font-family:sans-serif;padding:16px">The F1 season sheets need JavaScript to draw the charts.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
